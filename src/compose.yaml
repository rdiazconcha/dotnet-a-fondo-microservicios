name: faburobotics

services:
  catalog-api:
    image: faburobotics/catalog-api
    environment:
      ConnectionStrings__CatalogDb: Data Source=/home/app/catalog.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4317
      OTEL_SERVICE_NAME: catalog-api
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  
  orders-api:
    image: faburobotics/orders-api
    environment:
      ConnectionStrings__OrdersDb: Data Source=/home/app/orders.db
      Services__Catalog__BaseUrl: http://catalog-api:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: faburobotics
      RabbitMq__Password: faburobotics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4317
      OTEL_SERVICE_NAME: orders-api
    ports:
      - "8082:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: faburobotics
      RABBITMQ_DEFAULT_PASS: faburobotics
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  grafana:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
